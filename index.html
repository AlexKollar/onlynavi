function avRot(s){return s.replace(/[a-z]/g,function(c){return String.fromCharCode((c.charCodeAt(0)-97+13)%26+97);});}
function avNorm(s){return (s||'').toLowerCase().replace(/^flag=/,'').replace(/[^a-z0-9]/g,'');}

function avPcts(p,v){var base=p.options.map(function(o){return o.pct;});if(v===null)return base;var out=base.slice();out[v]+=7;var sum=0,i;for(i=0;i<base.length;i++)if(i!==v)sum+=base[i];var rest=100-out[v];for(i=0;i<out.length;i++)if(i!==v)out[i]=Math.round(base[i]*rest/sum);var tot=out.reduce(function(a,b){return a+b;},0);out[v]+=100-tot;return out;}
function avPoll(p){var v=null;try{var s=localStorage.getItem('nr-av-poll');if(s!==null)v=parseInt(s,10);}catch(e){}
 if(v===null||isNaN(v)){return '<div class="av-poll">'+p.options.map(function(o,i){return '<button class="av-pollopt" onclick="avVote('+i+')">'+o.label+'</button>';}).join('')+'</div>';}
 var pcts=avPcts(p,v);return '<div class="av-poll">'+p.options.map(function(o,i){return '<div class="av-pollbar">'+o.label+(i===v?' · your vote':'')+' — '+pcts[i]+'%<div class="bar"><i style="width:'+pcts[i]+'%"></i></div></div>';}).join('')+'<p style="margin-top:8px;color:var(--muted);font-size:13px">'+p.note+'</p></div>';}
function avVote(i){try{localStorage.setItem('nr-av-poll',String(i));}catch(e){}avRender();}
function avTip(){var b=document.getElementById('av-tipbox');if(!b)return;var f=window._avf;if(!f||!f.tips)return;if(b.innerHTML){b.innerHTML='';return;}b.innerHTML=f.tips.menu.map(function(t){return '<button onclick="avTipPick()">'+t.item+' — '+t.price+'</button>';}).join('');}
function avTipPick(){avConfetti();var b=document.getElementById('av-tipbox');if(b&&window._avf&&window._avf.tips)b.innerHTML=window._avf.tips.refusal;}

function avToast(msg){var t=document.getElementById('av-toast');if(!t){t=document.createElement('div');t.id='av-toast';t.className='av-toast';document.body.appendChild(t);}t.textContent=msg;t.classList.add('show');clearTimeout(window._avtt);window._avtt=setTimeout(function(){t.classList.remove('show');},2600);}

<script>
/* The Living Mesh — her network as weather. Nodes keep station around slow
   Lissajous anchors (bounded by construction, nothing integrates away),
   links kindle between neighbours, and bright pulses ride the links like
   packets finding a route. Canvas 2D, no assets, faint by design. */
(function () {
  var cv = document.getElementById('mesh-canvas');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var W = 0, H = 0;

  function size() {
    var DPR = Math.min(window.devicePixelRatio || 1, 1.25);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  size();
  window.addEventListener('resize', size);

  var TAU = Math.PI * 2;
  function rnd(a, b) { return a + Math.random() * (b - a); }

  function Node(i) {
    this.hx = Math.random();                       // anchor, fraction of viewport
    this.hy = Math.random();
    this.rx = rnd(14, 52);                          // slow orbit radii, px
    this.ry = rnd(10, 40);
    this.ax = TAU / rnd(26000, 52000);              // one lap every ~26-52 s
    this.ay = TAU / rnd(26000, 52000);
    this.px = rnd(0, TAU);
    this.py = rnd(0, TAU);
    this.hub = i < 2;                               // two gateways burn a little brighter
    this.violet = !this.hub && Math.random() < 0.22;
    this.r = this.hub ? rnd(2.4, 3.0) : rnd(1.1, 2.1);
    this.flare = 0;
    this.x = 0; this.y = 0;
  }
  Node.prototype.place = function (t) {
    this.x = this.hx * W + Math.sin(t * this.ax + this.px) * this.rx;
    this.y = this.hy * H + Math.cos(t * this.ay + this.py) * this.ry;
  };

  var count = Math.round(Math.min(32, Math.max(14, (W * H) / 62000)));
  var nodes = [];
  for (var i = 0; i < count; i++) nodes.push(new Node(i));

  var pulses = [];                                  // {a, b, t0, dur}
  function linkDist() { return Math.max(120, Math.min(200, W * 0.17)); }

  function draw(t, withPulses) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    var i, j;
    for (i = 0; i < nodes.length; i++) nodes[i].place(t);
    var LD = linkDist(), links = [];

      for (j = i + 1; j < nodes.length; j++) {
        var dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < LD) {
          var a = (1 - d / LD) * 0.13;
          ctx.strokeStyle = 'rgba(45,212,191,' + a.toFixed(3) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.stroke();
          links.push([i, j]);
        }
      }
    }

    // pulses: packets riding live links
    if (withPulses) {
      if (links.length && pulses.length < 4 && Math.random() < 0.010) {
        var pick = links[Math.floor(Math.random() * links.length)];
        if (Math.random() < 0.5) pick = [pick[1], pick[0]];
        pulses.push({ a: pick[0], b: pick[1], t0: t, dur: rnd(900, 1600) });
      }
      for (i = pulses.length - 1; i >= 0; i--) {
        var p = pulses[i], f = (t - p.t0) / p.dur;
        if (f >= 1) { nodes[p.b].flare = 1; pulses.splice(i, 1); continue; }
        var A = nodes[p.a], B = nodes[p.b];
        for (var k = 5; k >= 0; k--) {              // fading trail behind the head
          var ff = f - k * 0.035;
          if (ff < 0) continue;
          var x = A.x + (B.x - A.x) * ff, y = A.y + (B.y - A.y) * ff;
          var al = 0.5 * (1 - k / 6), rr = 2.3 * (1 - k / 9);

        }
      }
    }

    for (i = 0; i < nodes.length; i++) {
      var nd = nodes[i];

      var col = nd.violet ? '167,139,250' : '45,212,191';

      ctx.beginPath(); ctx.arc(nd.x, nd.y, haloR, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(' + (nd.hub ? '200,255,246' : col) + ',' + (base + nd.flare * 0.45).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(nd.x, nd.y, nd.r + nd.flare * 1.4, 0, TAU); ctx.fill();
      nd.flare *= 0.94;
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) { draw(4200, false); return; }
  function frame(t) { draw(t, true); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
})();

</script>
<script>
/* Installed web apps hold pages too long. The worker keeps page
   loads network-first so a publish reaches the app on next launch. */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
