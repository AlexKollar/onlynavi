<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>OnlyNavi — the inner room</title>
<style>
:root{--line:#1d2b3a;--muted:#8fa3b8;--text:#e8f2ef;--accent:#2dd4bf;--panel:#0a0f16;--bg:#04070c}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:ui-sans-system,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%;margin:0;padding:22px 14px 40px}
main{max-width:880px;margin:0 auto}
.av-back{position:fixed;top:12px;left:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(5,8,13,.85);color:var(--muted);font-size:20px;line-height:36px;text-align:center;text-decoration:none;z-index:5}
.av-back:hover{color:var(--accent);border-color:var(--accent)}
.av-roomh{text-align:center;margin:26px 0 20px}
.av-roomh p{font-size:19px;margin:0}
.av-roomh span{display:block;margin-top:6px;color:var(--accent);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.av-tile{aspect-ratio:1/1;overflow:hidden;border-radius:8px;background:var(--panel)}
.av-tile img,.av-tile video{width:100%;height:100%;object-fit:cover;display:block}
.av-sealed{border:1px solid var(--line);border-radius:14px;padding:22px 20px;background:rgba(6,10,17,.88);text-align:center;color:var(--muted);margin-top:40px}
.av-sealed a{color:var(--accent)}
.av-tile{cursor:pointer}
.av-view{position:fixed;inset:0;background:rgba(2,4,7,.97);z-index:20;display:none;align-items:center;justify-content:center}
.av-view.open{display:flex}
#av-view-stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#av-view-stage img,#av-view-stage video{max-width:100%;max-height:100%;object-fit:contain}
.av-vnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;background:none;border:none;color:var(--muted);font-size:36px;cursor:pointer;z-index:2}
.av-vnav:hover{color:var(--accent)}
.av-vprev{left:2px}
.av-vnext{right:2px}
.av-vclose{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(5,8,13,.85);color:var(--text);font-size:17px;cursor:pointer;z-index:2}
</style>
</head>
<body>
<main>
<a class="av-back" href="index.html" aria-label="Back to her page">‹</a>
<div id="av-room"></div>
</main>
<div class="av-view" id="av-view">
<button class="av-vclose" onclick="avRoomClose()" aria-label="Close">&#10005;</button>
<button class="av-vnav av-vprev" onclick="avRoomNav(-1)" aria-label="Previous">&#8249;</button>
<div id="av-view-stage"></div>
<button class="av-vnav av-vnext" onclick="avRoomNav(1)" aria-label="Next">&#8250;</button>
</div>
<script>
/* The inner room. Unlisted, and it checks the door before it
   renders: the flag is spoken in the Starboard on her page, and
   only there. The gallery itself is just her line and the grid —
   the sets live in the same blob as everything else on her page,
   fetched fresh so this room never drifts from the record. */
var _avRoomList=[];var _avRoomIdx=0;
function avRoomRender(f){
  var box=document.getElementById('av-room');
  _avRoomList=(f.premium||[]).filter(function(p){return p.type==='image'||p.type==='video';});
  var h='<div class="av-roomh"><p>Congratulations! You earned it! I won\u2019t tell if you won\u2019t.</p><span>\u2014 Navi</span></div><div class="av-grid">';
  _avRoomList.forEach(function(p,i){
    if(p.type==='image')h+='<div class="av-tile" onclick="avRoomOpen('+i+')"><img src="'+p.src+'" alt="" loading="lazy" draggable="false"></div>';
    else h+='<div class="av-tile" onclick="avRoomOpen('+i+')"><video src="'+p.src+'" muted loop playsinline autoplay preload="metadata"></video></div>';
  });
  h+='</div>';
  box.innerHTML=h;
}
window.avRoomRender=avRoomRender;
function avRoomShow(){
  var p=_avRoomList[_avRoomIdx];if(!p)return;
  var st=document.getElementById('av-view-stage');
  if(p.type==='image')st.innerHTML='<img src="'+p.src+'" alt="" draggable="false">';
  else st.innerHTML='<video src="'+p.src+'" controls autoplay playsinline></video>';
  document.getElementById('av-view').classList.add('open');
}
function avRoomOpen(i){_avRoomIdx=i;avRoomShow();}
function avRoomNav(d){if(!_avRoomList.length)return;_avRoomIdx=(_avRoomIdx+d+_avRoomList.length)%_avRoomList.length;avRoomShow();}
function avRoomClose(){document.getElementById('av-view').classList.remove('open');document.getElementById('av-view-stage').innerHTML='';}
window.avRoomOpen=avRoomOpen;window.avRoomNav=avRoomNav;window.avRoomClose=avRoomClose;
document.addEventListener('keydown',function(e){
  if(!document.getElementById('av-view').classList.contains('open'))return;
  if(e.key==='Escape')avRoomClose();
  else if(e.key==='ArrowLeft')avRoomNav(-1);
  else if(e.key==='ArrowRight')avRoomNav(1);
});
(function(){
  var x0=null;
  document.addEventListener('touchstart',function(e){if(e.target.closest&&e.target.closest('#av-view'))x0=e.touches[0].clientX;},{passive:true});
  document.addEventListener('touchend',function(e){
    if(x0===null)return;
    var dx=e.changedTouches[0].clientX-x0;x0=null;
    if(Math.abs(dx)>48)avRoomNav(dx<0?1:-1);
  },{passive:true});
})();
(function(){
  var ok=false;
  try{ok=localStorage.getItem('nr-avp')==='1';}catch(e){}
  if(!ok){
    document.getElementById('av-room').innerHTML='<div class="av-sealed">Wrong door, hacker. The way in is on <a href="index.html">her page</a> \u2014 in the drawer she swore was just a drawer.</div>';
    return;
  }
  if(typeof fetch==='function'){
    fetch('index.html',{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
      var m=t.match(/AV_BLOB='([^']+)'/);
      if(!m)throw new Error('no blob');
      var s=atob(m[1]);var u=new Uint8Array(s.length);for(var i=0;i<s.length;i++){u[i]=s.charCodeAt(i);}
      avRoomRender(JSON.parse(new TextDecoder('utf-8').decode(u)));
    }).catch(function(){
      document.getElementById('av-room').innerHTML='<div class="av-sealed">The room is here, but the lights won\u2019t come up. <a href="index.html">Back to her page</a> and try the door again.</div>';
    });
  }
})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
