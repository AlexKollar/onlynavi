<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>OnlyNavi — the inner room</title>
<style>
:root{--line:#1d2b3a;--muted:#8fa3b8;--text:#e8f2ef;--accent:#2dd4bf;--panel:#0a0f16;--bg:#04070c}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:ui-sans-system,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%;margin:0;padding:22px 14px 40px}
main{max-width:880px;margin:0 auto}
.av-back{position:fixed;top:12px;left:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(5,8,13,.85);color:var(--muted);font-size:20px;line-height:36px;text-align:center;text-decoration:none;z-index:5}
.av-back:hover{color:var(--accent);border-color:var(--accent)}
.av-roomh{text-align:center;margin:26px 0 20px}
.av-roomh p{font-size:19px;margin:0}
.av-roomh span{display:block;margin-top:6px;color:var(--accent);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.av-tile{aspect-ratio:1/1;overflow:hidden;border-radius:8px;background:var(--panel)}
.av-tile img,.av-tile video{width:100%;height:100%;object-fit:cover;display:block}
.av-sealed{border:1px solid var(--line);border-radius:14px;padding:22px 20px;background:rgba(6,10,17,.88);text-align:center;color:var(--muted);margin-top:40px}
.av-sealed a{color:var(--accent)}
</style>
</head>
<body>
<main>
<a class="av-back" href="index.html" aria-label="Back to her page">‹</a>
<div id="av-room"></div>
</main>
<script>
/* The inner room. Unlisted, and it checks the door before it
   renders: the flag is spoken in the Starboard on her page, and
   only there. The gallery itself is just her line and the grid —
   the sets live in the same blob as everything else on her page,
   fetched fresh so this room never drifts from the record. */
function avRoomRender(f){
  var box=document.getElementById('av-room');
  var h='<div class="av-roomh"><p>Congratulations! You earned it! I won\u2019t tell if you won\u2019t.</p><span>\u2014 Navi</span></div><div class="av-grid">';
  (f.premium||[]).forEach(function(p){
    if(p.type==='image')h+='<div class="av-tile"><img src="'+p.src+'" alt="" loading="lazy" draggable="false"></div>';
    else if(p.type==='video')h+='<div class="av-tile"><video src="'+p.src+'" muted loop playsinline autoplay preload="metadata"></video></div>';
  });
  h+='</div>';
  box.innerHTML=h;
}
window.avRoomRender=avRoomRender;
(function(){
  var ok=false;
  try{ok=localStorage.getItem('nr-avp')==='1';}catch(e){}
  if(!ok){
    document.getElementById('av-room').innerHTML='<div class="av-sealed">Wrong door, hacker. The way in is on <a href="index.html">her page</a> \u2014 in the drawer she swore was just a drawer.</div>';
    return;
  }
  if(typeof fetch==='function'){
    fetch('index.html',{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
      var m=t.match(/AV_BLOB='([^']+)'/);
      if(!m)throw new Error('no blob');
      var s=atob(m[1]);var u=new Uint8Array(s.length);for(var i=0;i<s.length;i++){u[i]=s.charCodeAt(i);}
      avRoomRender(JSON.parse(new TextDecoder('utf-8').decode(u)));
    }).catch(function(){
      document.getElementById('av-room').innerHTML='<div class="av-sealed">The room is here, but the lights won\u2019t come up. <a href="index.html">Back to her page</a> and try the door again.</div>';
    });
  }
})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
